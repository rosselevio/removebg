    <h1 class="text-[42px] md:text-[56px] font-extrabold leading-[0.95] tracking-tight">Remova o fundo<br><span class="bg-gradient-to-r from-[#6366f1] to-[#8b5cf6] bg-clip-text text-transparent">da imagem</span></h1>
    <p class="mt-4 text-[16px] text-slate-500">100% automático e gratuito • PNG transparente real • Sem marca d'água</p>
  </div>

  <div id="uploadZone" class="mt-10 max-w-[760px] mx-auto rounded-[24px] bg-white border border-slate-200 shadow-[0_20px_60px_-24px_rgba(0,0,0,0.15)] p-2">
    <div id="dropArea" class="rounded-[18px] border-[2px] border-dashed border-slate-200 bg-[#fbfdff] px-6 py-10 text-center transition">
      <div class="mx-auto w-14 h-14 rounded-2xl bg-indigo-50 flex items-center justify-center mb-4">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </div>
      <h3 class="font-semibold text-[18px]">Arraste imagens aqui</h3>
      <p class="text-[13px] text-slate-500 mt-1">ou clique para selecionar • Ctrl+V para colar</p>
      <button id="btnUpload" class="mt-5 inline-flex h-11 px-7 rounded-full bg-[#111827] text-white font-semibold text-[14px] hover:bg-black">Enviar imagem</button>
      <p class="mt-4 text-[11px] text-slate-400">Suporta JPG, PNG, WEBP • Lote ilimitado</p>
      <input id="fileInput" type="file" accept="image/*" multiple hidden>
    </div>
  </div>

  <div id="results" class="mt-8 grid gap-6 max-w-[1100px] mx-auto"></div>

  <div id="batchBar" class="hidden max-w-[760px] mx-auto mt-6 p-3 rounded-full bg-white border border-slate-200 shadow flex items-center justify-between">
    <span id="batchCount" class="text-[13px] font-medium px-3"></span>
    <div class="flex gap-2">
      <button id="btnZip" class="h-9 px-5 rounded-full bg-[#6366f1] text-white text-[13px] font-semibold">Baixar ZIP</button>
      <button id="btnClear" class="h-9 px-4 rounded-full bg-slate-100 text-[13px]">Limpar</button>
    </div>
  </div>
</main>

<div id="bgPanel" class="fixed inset-0 z-[60] hidden">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" id="bgPanelBackdrop"></div>
  <div class="absolute right-0 top-0 h-full w-full max-w-[380px] bg-white shadow-2xl p-6 overflow-auto">
    <div class="flex items-center justify-between mb-6"><h3 class="font-bold text-[18px]">Trocar Fundo</h3><button id="bgClose" class="w-8 h-8 rounded-full bg-slate-100">✕</button></div>
    <p class="text-[12px] font-semibold text-slate-500 tracking-widest mb-3">CORES</p>
    <div id="colorGrid" class="grid grid-cols-6 gap-2 mb-6"></div>
    <p class="text-[12px] font-semibold text-slate-500 tracking-widest mb-3">GRADIENTES</p>
    <div id="gradGrid" class="grid grid-cols-3 gap-2 mb-6"></div>
    <div class="space-y-4">
      <label class="block"><span class="text-[12px] font-semibold">Desfoque do fundo original</span><input id="blurRange" type="range" min="0" max="20" value="0" class="w-full"></label>
      <label class="block"><span class="text-[12px] font-semibold">Imagem de fundo</span><input id="bgImageInput" type="file" accept="image/*" class="mt-1 block w-full text-[12px]"></label>
      <button id="bgTransparent" class="w-full h-10 rounded-full border text-[13px] font-medium">Fundo transparente (xadrez)</button>
    </div>
  </div>
</div>

<div id="brushModal" class="fixed inset-0 z-[70] hidden bg-[#0b0f19] flex-col">
  <div class="h-[56px] flex items-center justify-between px-4 border-b border-white/10 text-white">
    <div class="flex items-center gap-3">
      <button id="brushClose" class="w-8 h-8 rounded-full bg-white/10">✕</button>
      <span class="font-semibold">Pincel Mágico</span>
      <span class="text-[11px] px-2 py-1 rounded-full bg-white/10">APAGAR = vermelho • RESTAURAR = verde</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="undoBtn" class="h-8 px-3 rounded-full bg-white/10 text-[12px]">Desfazer</button>
      <button id="redoBtn" class="h-8 px-3 rounded-full bg-white/10 text-[12px]">Refazer</button>
      <button id="brushSave" class="h-8 px-4 rounded-full bg-[#6366f1] text-[13px] font-semibold">Salvar</button>
    </div>
  </div>
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
    <div class="w-full md:w-[300px] bg-[#121826] border-r border-white/10 p-4 space-y-5">
      <div class="grid grid-cols-2 gap-2">
        <button id="modeErase" class="h-11 rounded-xl bg-red-500 text-white font-semibold text-[13px]">APAGAR</button>
        <button id="modeRestore" class="h-11 rounded-xl bg-white/10 text-white font-semibold text-[13px]">RESTAURAR</button>
      </div>
      <div><label class="text-[11px] text-white/60">Tamanho <span id="sizeVal">40</span></label><input id="brushSize" type="range" min="5" max="200" value="40" class="w-full"></div>
      <div><label class="text-[11px] text-white/60">Dureza <span id="hardVal">80%</span></label><input id="brushHard" type="range" min="1" max="100" value="80" class="w-full"></div>
      <p class="text-[11px] text-white/40 leading-relaxed">Arraste sobre a imagem. O modo APAGAR remove pixels (fica transparente). RESTAURAR traz de volta da imagem original removida pelo modelo.</p>
    </div>
    <div class="flex-1 relative bg-[#0b0f19] flex items-center justify-center overflow-auto p-4">
      <div class="relative checker rounded-xl overflow-hidden shadow-2xl" id="canvasWrap"><canvas id="brushCanvas" class="block max-w-[90vw] max-h-[70vh]"></canvas></div>
    </div>
  </div>
</div>

<footer class="border-t border-slate-100 py-8 text-center text-[12px] text-slate-500">Processamento 100% no seu navegador • Sem envio para servidor • PNG transparente real</footer>

<script type="module">
import { removeBackground } from "@imgly/background-removal"
import JSZip from "jszip"

const $ = s => document.querySelector(s);
const fileInput = $("#fileInput");
const dropArea = $("#dropArea");
const uploadZone = $("#uploadZone");
const btnUpload = $("#btnUpload");
const resultsEl = $("#results");
const batchBar = $("#batchBar");
const batchCount = $("#batchCount");

let items = [];
let activeBgItem = null;
let activeBrushItem = null;

// Colors / grads
const colors = ["#ffffff","#000000","#6366f1","#ec4899","#22c55e","#f59e0b","#06b6d4","#ef4444","#f97316","#a855f7","#84cc16","#eab308"];
const grads = [
  "linear-gradient(135deg,#6366f1,#8b5cf6)",
  "linear-gradient(135deg,#f59e0b,#ef4444)",
  "linear-gradient(135deg,#06b6d4,#3b82f6)",
  "linear-gradient(135deg,#22c55e,#16a34a)",
  "linear-gradient(135deg,#ec4899,#8b5cf6)",
  "linear-gradient(135deg,#0f172a,#334155)"
];

function renderBgOptions(){
  const cg = $("#colorGrid"); cg.innerHTML="";
  colors.forEach(c=>{
    const b=document.createElement("button");
    b.className="w-10 h-10 rounded-full border border-slate-200 shadow-sm";
    b.style.background=c;
    b.onclick=()=>{ if(activeBgItem){ activeBgItem.bg={type:"color",value:c}; renderResults(); closeBg(); } };
    cg.appendChild(b);
  });
  const gg=$("#gradGrid"); gg.innerHTML="";
  grads.forEach(g=>{
    const b=document.createElement("button");
    b.className="h-14 rounded-xl border";
    b.style.background=g;
    b.onclick=()=>{ if(activeBgItem){ activeBgItem.bg={type:"gradient",value:g}; renderResults(); closeBg(); } };
    gg.appendChild(b);
  });
}
renderBgOptions();

function openBg(item){ activeBgItem=item; $("#bgPanel").classList.remove("hidden"); }
function closeBg(){ $("#bgPanel").classList.add("hidden"); activeBgItem=null; }
$("#bgPanelBackdrop").onclick=closeBg; $("#bgClose").onclick=closeBg;
$("#bgTransparent").onclick=()=>{ if(activeBgItem){ activeBgItem.bg={type:"transparent",value:""}; renderResults(); closeBg(); } };
$("#blurRange").oninput=(e)=>{ if(activeBgItem){ activeBgItem.bg={type:"blur",value:"", blurValue: parseInt(e.target.value)}; renderResults(); } };
$("#bgImageInput").onchange=async(e=>{
  const f=e.target.files[0]; if(!f||!activeBgItem) return;
  const url=URL.createObjectURL(f);
  activeBgItem.bg={type:"image", value:"", imageUrl:url};
  renderResults(); closeBg();
});

// Brush
const brushModal=$("#brushModal");
const canvas=$("#brushCanvas");
const ctx=canvas.getContext("2d",{willReadFrequently:true});
let mode="erase";
let brushSize=40;
let brushHard=80;
let history=[]; let redoStack=[];
let isDrawing=false;
let origImg=new Image(); let cutImg=new Image();
let origLoaded=false; let cutLoaded=false;

function pushHistory(){
  try{ history.push(ctx.getImageData(0,0,canvas.width,canvas.height)); if(history.length>25) history.shift(); redoStack=[]; }catch{}
}
$("#modeErase").onclick=()=>{ mode="erase"; $("#modeErase").className="h-11 rounded-xl bg-red-500 text-white font-semibold text-[13px]"; $("#modeRestore").className="h-11 rounded-xl bg-white/10 text-white font-semibold text-[13px]"; };
$("#modeRestore").onclick=()=>{ mode="restore"; $("#modeRestore").className="h-11 rounded-xl bg-green-500 text-white font-semibold text-[13px]"; $("#modeErase").className="h-11 rounded-xl bg-white/10 text-white font-semibold text-[13px]"; };
$("#brushSize").oninput=(e)=>{ brushSize=parseInt(e.target.value); $("#sizeVal").textContent=brushSize; };
$("#brushHard").oninput=(e)=>{ brushHard=parseInt(e.target.value); $("#hardVal").textContent=brushHard+"%"; };

function resizeCanvas(){
  // keep aspect
}
function openBrush(item){
  activeBrushItem=item;
  if(!item.resultBlob) return;
  history=[]; redoStack=[];
  origImg=new Image(); cutImg=new Image();
  origLoaded=false; cutLoaded=false;
  origImg.onload=()=>{ origLoaded=true; if(cutLoaded) initCanvas(); };
  cutImg.onload=()=>{ cutLoaded=true; if(origLoaded) initCanvas(); };
  origImg.src=item.originalUrl;
  cutImg.src=item.resultUrl;
  brushModal.classList.remove("hidden");
  brushModal.classList.add("flex");
}
function initCanvas(){
  const maxW=900; const maxH=700;
  let w=cutImg.naturalWidth, h=cutImg.naturalHeight;
  const ratio=Math.min(maxW/w, maxH/h, 1);
  w=Math.round(w*ratio); h=Math.round(h*ratio);
  canvas.width=w; canvas.height=h;
  ctx.clearRect(0,0,w,h);
  ctx.drawImage(cutImg,0,0,w,h);
  pushHistory();
}
function getPos(e){
  const rect=canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const scaleX=canvas.width/rect.width;
  const scaleY=canvas.height/rect.height;
  return { x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY };
}
function drawStroke(x,y){
  ctx.save();
  if(mode==="erase"){
    ctx.globalCompositeOperation="destination-out";
    const grd=ctx.createRadialGradient(x,y, brushSize*0.2, x,y, brushSize/2);
    const alpha = brushHard/100;
    grd.addColorStop(0, "rgba(0,0,0,1)");
    grd.addColorStop(alpha, "rgba(0,0,0,1)");
    grd.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(x,y,brushSize/2,0,Math.PI*2); ctx.fill();
  }else{
    // restore from original image
    const sw=brushSize; const sh=brushSize;
    const sx = Math.max(0, (x / canvas.width)*origImg.naturalWidth - sw/2);
    const sy = Math.max(0, (y / canvas.height)*origImg.naturalHeight - sh/2);
    // clip circle
    ctx.beginPath(); ctx.arc(x,y,brushSize/2,0,Math.PI*2); ctx.clip();
    // draw original but scaled to canvas size, then draw cut again? Actually restore means bring back cutout if erased, else bring original content
    // For areas removed by model, we want original; for areas erased by brush, we want cutout. We blend: draw original image scaled
    // To approximate cutout restore, we draw cutImg again if we have it, else original
    // If pixel in cutImg was transparent (model removed), drawing cutImg does nothing, so we need original
    // So we try cutImg first, then original as fallback for transparent
    ctx.globalCompositeOperation="source-over";
    // draw cutImg portion
    ctx.drawImage(cutImg, 0,0, cutImg.naturalWidth, cutImg.naturalHeight, 0,0, canvas.width, canvas.height);
    // where still transparent, draw original
    ctx.globalCompositeOperation="source-over";
    ctx.globalAlpha=0.15;
    ctx.drawImage(origImg, 0,0, origImg.naturalWidth, origImg.naturalHeight, 0,0, canvas.width, canvas.height);
    ctx.globalAlpha=1;
    // second pass: draw cutImg again with hard edge for already existing cutout
    // Actually final restore logic: just draw original image clipped - gives ability to recover background removed areas
    ctx.globalCompositeOperation="source-over";
    ctx.drawImage(origImg, 0,0, origImg.naturalWidth, origImg.naturalHeight, 0,0, canvas.width, canvas.height);
    // then re-apply cut where we have it? Simplifies to original restore
    // To keep transparent result realistic, we instead draw the cutout image's non-transparent parts only if user erased them
    // We'll just draw cutImg again with full opacity after clearing restore area? Let's do both: draw original then draw cutImg at low opacity to preserve
  }
  ctx.restore();
}
canvas.addEventListener("pointerdown", e=>{
  isDrawing=true; canvas.setPointerCapture(e.pointerId);
  pushHistory();
  const p=getPos(e); drawStroke(p.x,p.y);
});
canvas.addEventListener("pointermove", e=>{
  if(!isDrawing) return;
  const p=getPos(e); drawStroke(p.x,p.y);
});
canvas.addEventListener("pointerup", ()=>{ isDrawing=false; });
canvas.addEventListener("pointercancel", ()=>{ isDrawing=false; });

$("#undoBtn").onclick=()=>{
  if(history.length<=1) return;
  const cur=history.pop();
  redoStack.push(cur);
  const prev=history[history.length-1];
  ctx.putImageData(prev,0,0);
};
$("#redoBtn").onclick=()=>{
  if(!redoStack.length) return;
  const nxt=redoStack.pop();
  history.push(nxt);
  ctx.putImageData(nxt,0,0);
};
$("#brushClose").onclick=()=>{ brushModal.classList.add("hidden"); brushModal.classList.remove("flex"); };
$("#brushSave").onclick=async()=>{
  canvas.toBlob(blob=>{
    if(!blob||!activeBrushItem) return;
    const url=URL.createObjectURL(blob);
    activeBrushItem.resultBlob=blob;
    activeBrushItem.resultUrl=url;
    renderResults();
    brushModal.classList.add("hidden"); brushModal.classList.remove("flex");
  },"image/png");
};

// Upload handling
function handleFiles(fileList){
  const files=[...fileList].filter(f=>f.type.startsWith("image/"));
  if(!files.length) return;
  files.forEach(f=>{
    const id=Math.random().toString(36).slice(2);
    const originalUrl=URL.createObjectURL(f);
    const item={ id, file:f, originalUrl, resultUrl:null, resultBlob:null, status:"idle", bg:{type:"transparent",value:""} };
    items.push(item);
    processItem(item);
  });
  renderResults();
  updateBatchBar();
}
async function processItem(item){
  item.status="processing"; renderResults();
  try{
    // CORRETO: passa File direto, sem fetch de blob URL
    const blobTransparente = await removeBackground(item.file, {
      publicPath: "https://static.imgly.com/@imgly/background-removal-data/1.5.8/dist/",
      model: "medium",
      output: { format: "image/png", quality: 1 }
    });
    const url = URL.createObjectURL(blobTransparente);
    item.resultBlob=blobTransparente;
    item.resultUrl=url;
    item.status="done";
  }catch(err){
    console.error(err);
    item.status="error";
    item.error="Não foi possível remover o fundo. Tente outra imagem.";
  }
  renderResults();
}

function renderResults(){
  resultsEl.innerHTML="";
  items.forEach(item=>{
    const card=document.createElement("div");
    card.className="rounded-[20px] bg-white border border-slate-200 overflow-hidden shadow-sm";
    const top=document.createElement("div");
    top.className="p-3 flex items-center justify-between border-b border-slate-100";
    top.innerHTML='<span class="text-[12px] font-semibold truncate max-w-[160px]">'+item.file.name+'</span><span class="text-[10px] px-2 py-1 rounded-full '+(item.status==="done"?"bg-emerald-50 text-emerald-700 border border-emerald-200":item.status==="processing"?"bg-amber-50 text-amber-700 border border-amber-200":"bg-slate-100 text-slate-600")+'">'+ (item.status==="processing"?"Removendo...":item.status==="done"?"Pronto":item.status==="error"?"Erro":"") +'</span>';
    const body=document.createElement("div");
    body.className="grid md:grid-cols-2";
    const left=document.createElement("div");
    left.className="relative aspect-[4/3] bg-slate-50 border-r border-slate-100 overflow-hidden";
    left.innerHTML='<div class="absolute inset-0 flex items-center justify-center"><img src="'+item.originalUrl+'" class="max-w-full max-h-full object-contain"></div><div class="absolute bottom-2 left-2 text-[10px] px-2 py-1 rounded-full bg-black/60 text-white">Original</div>';
    const right=document.createElement("div");
    right.className="relative aspect-[4/3] overflow-hidden checker";
    let bgStyle="";
    if(item.bg.type==="color") bgStyle='background:'+item.bg.value;
    else if(item.bg.type==="gradient") bgStyle='background:'+item.bg.value;
    else if(item.bg.type==="image"&&item.bg.imageUrl) bgStyle='background-image:url('+item.bg.imageUrl+');background-size:cover;background-position:center';
    else bgStyle='';
    if(item.bg.type==="blur"){
      const blurImg=document.createElement("div");
      blurImg.className="absolute inset-0";
      blurImg.style.backgroundImage='url('+item.originalUrl+')';
      blurImg.style.backgroundSize='cover';
      blurImg.style.filter='blur('+(item.bg.blurValue||0)+'px)';
      blurImg.style.transform='scale(1.1)';
      right.appendChild(blurImg);
    }
    const bgDiv=document.createElement("div");
    bgDiv.className="absolute inset-0";
    bgDiv.setAttribute("style",bgStyle);
    right.appendChild(bgDiv);
    if(item.status==="processing"){
      right.innerHTML+='<div class="absolute inset-0 flex flex-col items-center justify-center bg-white/70 backdrop-blur"><div class="w-8 h-8 border-2 border-slate-200 border-t-[#6366f1] rounded-full animate-spin"></div><p class="mt-3 text-[12px] font-medium text-slate-600">Removendo fundo...</p></div>';
    }else if(item.status==="done"&&item.resultUrl){
      const img=document.createElement("img");
      img.src=item.resultUrl;
      img.className="absolute inset-0 w-full h-full object-contain p-2";
      right.appendChild(img);
      const badge=document.createElement("div");
      badge.className="absolute bottom-2 left-2 text-[10px] px-2 py-1 rounded-full bg-black/60 text-white";
      badge.textContent="HD • PNG transparente";
      right.appendChild(badge);
    }else if(item.status==="error"){
      right.innerHTML+='<div class="absolute inset-0 flex items-center justify-center p-6 text-center"><p class="text-[12px] text-red-600">'+(item.error||"Erro")+'</p></div>';
    }else{
      right.innerHTML+='<div class="absolute inset-0 flex items-center justify-center text-slate-400 text-[12px]">Aguardando</div>';
    }
    body.appendChild(left); body.appendChild(right);
    const actions=document.createElement("div");
    actions.className="p-3 flex flex-wrap gap-2 border-t border-slate-100 bg-[#fcfdff]";
    if(item.status==="done"){
      actions.innerHTML='<button data-dl="'+item.id+'" class="h-9 px-4 rounded-full bg-[#111827] text-white text-[12px] font-semibold">Download HD</button><button data-bg="'+item.id+'" class="h-9 px-4 rounded-full bg-white border text-[12px]">Trocar Fundo</button><button data-brush="'+item.id+'" class="h-9 px-4 rounded-full bg-white border text-[12px]">Pincel Mágico</button><button data-rm="'+item.id+'" class="ml-auto h-9 w-9 rounded-full bg-slate-100">✕</button>';
    }else{
      actions.innerHTML='<button data-rm="'+item.id+'" class="ml-auto h-9 w-9 rounded-full bg-slate-100">✕</button>';
    }
    card.appendChild(top); card.appendChild(body); card.appendChild(actions);
    resultsEl.appendChild(card);
  });
  // bind actions
  resultsEl.querySelectorAll("[data-dl]").forEach(b=>{
    b.addEventListener("click",()=>{
      const it=items.find(i=>i.id===b.getAttribute("data-dl"));
      if(!it||!it.resultBlob) return;
      // Se tiver fundo colorido, compor
      if(it.bg.type!=="transparent"){
        composeDownload(it);
      }else{
        const a=document.createElement("a");
        a.href=it.resultUrl; a.download=it.file.name.replace(/\\.[^.]+$/,"")+"-sem-fundo.png"; a.click();
      }
    });
  });
  resultsEl.querySelectorAll("[data-bg]").forEach(b=>b.addEventListener("click",()=>{ const it=items.find(i=>i.id===b.getAttribute("data-bg")); if(it) openBg(it); }));
  resultsEl.querySelectorAll("[data-brush]").forEach(b=>b.addEventListener("click",()=>{ const it=items.find(i=>i.id===b.getAttribute("data-brush")); if(it) openBrush(it); }));
  resultsEl.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{ const id=b.getAttribute("data-rm"); items=items.filter(i=>i.id!==id); renderResults(); updateBatchBar(); }));
}

function composeDownload(item){
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement("canvas");
    c.width=img.naturalWidth; c.height=img.naturalHeight;
    const cx=c.getContext("2d");
    if(item.bg.type==="color"){ cx.fillStyle=item.bg.value; cx.fillRect(0,0,c.width,c.height); }
    else if(item.bg.type==="gradient"){
      const g=cx.createLinearGradient(0,0,c.width,c.height);
      // parse simple: we extract colors? fallback solid
      // Use canvas with CSS gradient via temporary element
      const tmp=document.createElement("div");
      tmp.style.background=item.bg.value;
      tmp.style.width=c.width+"px"; tmp.style.height=c.height+"px";
      // draw gradient manually for known presets
      if(item.bg.value.includes("#6366f1")){ const lg=cx.createLinearGradient(0,0,c.width,c.height); lg.addColorStop(0,"#6366f1"); lg.addColorStop(1,"#8b5cf6"); cx.fillStyle=lg; cx.fillRect(0,0,c.width,c.height); }
      else { cx.fillStyle="#fff"; cx.fillRect(0,0,c.width,c.height); }
    }else if(item.bg.type==="image"&&item.bg.imageUrl){
      const bgI=new Image(); bgI.onload=()=>{ cx.drawImage(bgI,0,0,c.width,c.height); cx.drawImage(img,0,0); c.toBlob(b=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=item.file.name.replace(/\\.[^.]+$/,"")+"-com-fundo.png"; a.click(); }); }; bgI.src=item.bg.imageUrl; return;
    }else if(item.bg.type==="blur"){
